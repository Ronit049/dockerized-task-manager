<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockerized Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐳 Task Manager</h1>
            <p>Powered by FastAPI + MongoDB + Docker</p>
        </header>

        <section class="task-form">
            <input type="text" id="title" placeholder="Enter task title">
            <textarea id="description" placeholder="Enter task description"></textarea>
            <button onclick="addTask()">➕ Add Task</button>
        </section>

        <section>
            <div class="task-header">
                <h2>My Tasks</h2>
                <button class="refresh-btn" onclick="loadTasks()">🔄 Refresh</button>
            </div>
            <div id="tasks"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
